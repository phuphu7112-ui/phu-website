<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Distance from University</title>

<style>

body{
font-family:Arial;
margin:40px;
background:#f5f5f5;
}

.container{
width:350px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px gray;
}

input,button{
width:100%;
padding:10px;
margin-top:10px;
}

#result{
margin-top:20px;
font-size:20px;
font-weight:bold;
color:blue;
text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h2>Distance from University</h2>

<input type="number" id="x" placeholder="Enter X Coordinate">

<input type="number" id="y" placeholder="Enter Y Coordinate">

<button onclick="calculateDistance()">Calculate</button>

<button onclick="history.back()">Back</button>

<p id="result"></p>

</div>

<script>

function calculateDistance(){

let x=document.getElementById("x").value;
let y=document.getElementById("y").value;

if(x==""||y==""){
alert("Please enter X and Y.");
return;
}

x=parseFloat(x);
y=parseFloat(y);

let distance=Math.sqrt((x*x)+(y*y));

document.getElementById("result").innerHTML=
"Distance = "+distance.toFixed(2);

}

</script>

</body>
</html>
