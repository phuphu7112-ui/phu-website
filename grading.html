<div class="container">

<h2>Grade Calculator</h2>
<label>Student Name</label>
<input type="text" id="name" placeholder="Enter your name">
<label>Score</label>
<input type="number" id="score" placeholder="Enter your score">
<button onclick="calculateGrade()">Submit</button>
<p id="result" class="result"></p>
<script>
function calculateGrade(){
 let name=document.getElementById("name").value.trim();
 let score=document.getElementById("score").value;
 if(name===""){alert("Please enter your name.");return}
 if(score===""){alert("Please enter your score.");return}
 score=parseInt(score);
 if(score<0||score>100){alert("Score must be between 0 and 100.");return}
 let grade=score>=80?"A":score>=70?"B":score>=60?"C":score>=50?"D":"F";
 document.getElementById("result").innerHTML=name+"'s Grade : "+grade;
}
</script>

<p><a class="back-button" href="index.html">← Back to Resume</a></p>
</div>
</body></html>
