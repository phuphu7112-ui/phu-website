<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Measurement Converter</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            margin:40px;
        }

        .container{
            width:350px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h2{
            text-align:center;
        }

        input,select,button{
            width:100%;
            padding:10px;
            margin-top:10px;
        }

        #result{
            margin-top:20px;
            font-size:20px;
            font-weight:bold;
            color:blue;
            text-align:center;
        }
    
        .back-button{
            display:block;
            width:100%;
            padding:10px;
            margin-top:10px;
            background:#ff69b4;
            color:white;
            text-align:center;
            text-decoration:none;
            border-radius:5px;
            box-sizing:border-box;
            font-weight:bold;
        }
        .back-button:hover{background:#d63384;}
        </style>

</head>
<body>

<div class="container">

<h2>Measurement Converter</h2>

<input type="number" id="value" placeholder="Enter value">

<select id="conversion">
    <option value="mToKm">Meters → Kilometers</option>
    <option value="kmToM">Kilometers → Meters</option>
    <option value="cmToM">Centimeters → Meters</option>
    <option value="mToCm">Meters → Centimeters</option>
</select>

<button onclick="convert()">Convert</button>
<a class="back-button" href="index.html">← Back to Resume</a>

<p id="result"></p>

</div>

<script>

function convert(){

    let value=document.getElementById("value").value;
    let type=document.getElementById("conversion").value;

    if(value==""){
        alert("Please enter a value.");
        return;
    }

    value=parseFloat(value);

    let answer="";

    if(type=="mToKm"){
        answer=(value/1000).toFixed(2)+" km";
    }
    else if(type=="kmToM"){
        answer=(value*1000).toFixed(2)+" m";
    }
    else if(type=="cmToM"){
        answer=(value/100).toFixed(2)+" m";
    }
    else{
        answer=(value*100).toFixed(2)+" cm";
    }

    document.getElementById("result").innerHTML=answer;

}

</script>

</body>
</html>
