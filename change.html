<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Change Calculator</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:40px;
    background:#f5f5f5;
}
.container{
    width:350px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}
button,input{
    width:100%;
    padding:10px;
    margin-top:10px;
}

        .back-button{
            display:block;
            width:100%;
            padding:10px;
            margin-top:10px;
            background:#ff69b4;
            color:white;
            text-align:center;
            text-decoration:none;
            border-radius:5px;
            box-sizing:border-box;
            font-weight:bold;
        }
        .back-button:hover{background:#d63384;}
        </style>

</head>

<body>

<div class="container">

<h2>Change Calculator</h2>

<input type="number" id="amount" placeholder="Enter amount">

<button onclick="calculateChange()">Calculate</button>
<a class="back-button" href="index.html">← Back to Resume</a>

<div id="result"></div>

</div>

<script>

function calculateChange(){

    let amount=document.getElementById("amount").value;

    if(amount==""){
        alert("Please enter amount.");
        return;
    }

    amount=parseInt(amount);

    if(amount<0){
        alert("Invalid amount.");
        return;
    }

    let money=[1000,500,100,50,20,10,5,2,1];

    let result="";

    for(let i=0;i<money.length;i++){

        let count=Math.floor(amount/money[i]);

        if(money[i]>=20){
            result+="$"+money[i]+" note : "+count+"<br>";
        }
        else{
            result+="$"+money[i]+" coin : "+count+"<br>";
        }

        amount=amount%money[i];
    }

    document.getElementById("result").innerHTML=result;

}

</script>

</body>
</html>
