<div class="container">

<h2>Distance from University</h2>
<input type="number" id="x" placeholder="Enter X Coordinate">
<input type="number" id="y" placeholder="Enter Y Coordinate">
<button onclick="calculateDistance()">Calculate</button>
<p id="result" class="result"></p>
<script>
function calculateDistance(){
 let x=document.getElementById("x").value;
 let y=document.getElementById("y").value;
 if(x===""||y===""){alert("Please enter X and Y.");return}
 x=parseFloat(x); y=parseFloat(y);
 let distance=Math.sqrt((x*x)+(y*y));
 document.getElementById("result").innerHTML="Distance = "+distance.toFixed(2);
}
</script>
